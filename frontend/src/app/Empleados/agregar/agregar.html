<div class="content mt-3">
  <form (ngSubmit)="onSubmit(f)" #f="ngForm">
    <div class="form-group">
      <label for="nombre">Nombre:</label>
      <input
        type="text"
        class="form-control"
        id="nombre"
        name="nombre"
        [(ngModel)]="empleado.nombre"
        maxlength="150"
        pattern=".*\S.*"
        required
      />
    </div>

    <div class="form-group">
      <label for="apellido">Apellido:</label>
      <input
        type="text"
        class="form-control"
        id="apellido"
        name="apellido"
        [(ngModel)]="empleado.apellido"
        maxlength="150"
        pattern=".*\S.*"
        required
      />
    </div>

    <div class="form-group">
      <label for="email">Email:</label>
      <input type="email" class="form-control" id="email" name="email"
        [(ngModel)]="empleado.email" required email maxlength="254" #correo="ngModel" />
      @if (correo.invalid && (correo.touched || f.submitted)) {
        <p class="text-danger">Introduce un email válido. Este campo es obligatorio.</p>
      }
    </div>

    <div class="form-group">
      <label for="edad">Edad:</label>
      <input
        type="number"
        class="form-control"
        id="edad"
        name="edad"
        [(ngModel)]="empleado.edad"
        min="0" max="2147483647" step="1" pattern="[0-9]+"
        required
      />
    </div>

    <div class="form-group">
      <label for="salario">Salario:</label>
      <input
        type="number"
        class="form-control"
        id="salario"
        name="salario"
        [(ngModel)]="empleado.salario"
        min="0" max="9999999999.99" step="0.01" pattern="[0-9]+(\.[0-9]{1,2})?"
        required
      />
    </div>

    <div class="form-group">
      <label for="horas">Horas:</label>
      <input
        type="number"
        class="form-control"
        id="horas"
        name="horas"
        [(ngModel)]="empleado.horas"
        min="0" max="2147483647" step="1" pattern="[0-9]+"
        required
      />
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="f.invalid || guardando()">
      {{ guardando() ? 'Guardando…' : 'Guardar' }}
    </button>

    @if (error()) {
      <div class="alert alert-danger" role="alert">{{ error() }}</div>
    }
  </form>
</div>
